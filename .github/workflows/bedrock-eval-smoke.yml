name: Protected Bedrock eval smoke

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Exact trusted ref to evaluate (main or v* tag)"
        required: true
        default: "main"
        type: string
      eval_split:
        description: "Dataset split to use for bounded smoke"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - regression
          - holdout
      web_port:
        description: "Optional web port override for isolated runner execution"
        required: false
        default: "3000"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bedrock-eval-smoke
  cancel-in-progress: false

jobs:
  bedrock-smoke:
    name: Protected Bedrock smoke + artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: bedrock-eval-protected
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DYNAMODB_TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
      GLOBAL_BEDROCK_MONTHLY_LIMIT_USD: ${{ vars.GLOBAL_BEDROCK_MONTHLY_LIMIT_USD }}
      AWS_ROLE_DURATION_SECONDS: "1800"
      EVAL_ROOT: metrics/evals
      EVAL_SPLIT: ${{ inputs.eval_split }}
      EVAL_CONFIRM: "1"
      WEB_PORT: ${{ inputs.web_port }}
    steps:
      - name: Validate trusted dispatch inputs and repository
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "NakulManchanda/ai-analytics-poc"
          case "${{ inputs.release_ref }}" in
            main|v*) ;;
            *)
              echo "release_ref must be main or a v* tag" >&2
              exit 2
              ;;
          esac

      - name: Check out approved ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Verify checked-out ref provenance
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.release_ref }}" = "main" ]; then
            test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          else
            [[ "${{ inputs.release_ref }}" =~ ^v[0-9]+(\.[0-9]+){0,2}([-.][0-9A-Za-z.-]+)?$ ]]
            test "$(git rev-list -n 1 "${{ inputs.release_ref }}")" = "$(git rev-parse HEAD)"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.26"

      - name: Run offline preflight checks
        run: |
          make preflight
          make evals-test

      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.BEDROCK_EVAL_ROLE_ARN }}
          role-session-name: bedrock-eval-smoke
          role-duration-seconds: ${{ env.AWS_ROLE_DURATION_SECONDS }}
          mask-aws-account-id: true

      - name: Verify caller identity
        run: aws sts get-caller-identity >/dev/null

      - name: Start bounded real-AWS stack
        run: |
          make local-aws-litellm-compose
          make litellm-ready

      - name: Run bounded eval smoke
        run: |
          make eval-start LABEL=gha-${{ github.run_id }} EVAL_SPLIT=${EVAL_SPLIT}
          make eval-health
          make eval-smoke EVAL_CONFIRM=1
          make eval-freeze
          make eval-grade
          make eval-review

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bedrock-eval-smoke-${{ github.run_id }}
          path: |
            metrics/evals/.current
            metrics/evals/**/manifest.json
            metrics/evals/**/results.jsonl
            metrics/evals/**/matches.json
            metrics/evals/**/captures.snapshot.jsonl
            metrics/evals/**/captures.snapshot.sha256
            metrics/evals/**/report/**
            metrics/evals/**/logs/**
          if-no-files-found: warn

      - name: Teardown stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.aws.yml -f docker-compose.litellm.yml -f docker-compose.phoenix.yml -f docker-compose.phoenix-litellm.yml down --remove-orphans
