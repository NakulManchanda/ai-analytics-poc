# Local metrics/logs stack (Prometheus, Grafana, Loki, Alloy, Blackbox) plus the OTEL Collector.
# Traces go Collector -> Phoenix (#221), so layer docker-compose.phoenix.yml underneath (the Make targets do).
# Jaeger is opt-in: add docker-compose.jaeger.yml (`JAEGER=1`).
services:
  mcp:
    environment:
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: analytics-mcp
      OTEL_DEPLOYMENT_ENVIRONMENT: local-compose
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces

  app:
    environment:
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: ai-analytics-app
      OTEL_DEPLOYMENT_ENVIRONMENT: local-compose
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.157.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/core/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - phoenix

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./infra/observability/core/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:${BLACKBOX_PORT:-19115}:9115"

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/observability/core/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    depends_on:
      - blackbox-exporter

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/observability/core/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "127.0.0.1:${LOKI_PORT:-13100}:3100"

  alloy:
    image: grafana/alloy:v1.7.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/observability/core/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_USERS_DEFAULT_THEME: "dark"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13001}:3000"
    volumes:
      - ./infra/observability/core/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/core/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/core/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
