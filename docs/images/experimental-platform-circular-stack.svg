<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">NYC Taxi AI Analytics experimental platform: circular stack map</title>
<desc id="desc">Application and owned ReAct agent harness are central. Eight surrounding cards show MCP tools, model access, owned gateway, GPU serving, GPU infrastructure, observability, evaluations, and cloud state. Lines indicate conceptual dependencies, not request execution order.</desc>
