# Opt-in Compose overlay to route model calls through the owned inference serve path (vLLM)
services:
  app:
    environment:
      LLM_PROVIDER: serve
      VOICE_ENABLED: "false"
      INFERENCE_GATEWAY_URL: http://host.docker.internal:18080/serve
      INFERENCE_MODEL_ID: "${INFERENCE_MODEL_ID:-Qwen/Qwen3-0.6B}"
      DYNAMODB_TABLE_NAME: "${DYNAMODB_TABLE_NAME:-ai-analytics-poc-demo-application-state}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    volumes:
      - "${HOME}/.aws:/aws:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    environment:
      LLM_PROVIDER: serve
      VOICE_ENABLED: "false"
      INFERENCE_GATEWAY_URL: http://host.docker.internal:18080/serve
      INFERENCE_MODEL_ID: "${INFERENCE_MODEL_ID:-Qwen/Qwen3-0.6B}"
      DYNAMODB_TABLE_NAME: "${DYNAMODB_TABLE_NAME:-ai-analytics-poc-demo-application-state}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    volumes:
      - "${HOME}/.aws:/aws:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
