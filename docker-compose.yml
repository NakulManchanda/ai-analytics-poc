services:
  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 1).close()"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10

  app:
    build: ./services/app
    environment:
      MCP_URL: http://mcp:8001/mcp
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: fake
    depends_on:
      mcp:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 1s
      timeout: 1s
      retries: 10

  worker:
    build: ./services/app
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    environment:
      MCP_URL: http://mcp:8001/mcp
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: fake
    depends_on:
      mcp:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:8080"

