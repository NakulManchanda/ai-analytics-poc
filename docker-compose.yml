services:
  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 1).close()"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 5s

  app:
    build: ./services/app
    environment:
      MCP_URL: http://mcp:8001/mcp
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 1s
      timeout: 1s
      retries: 10

  web:
    build: ./web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3000:8080"
