[project]
name = "ai-benchmarks"
version = "0.1.0"
description = "Offline scenario replay and benchmark tooling for the AI Analytics POC"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
# Checks that import the application package (catalogue alignment, canonical prefix drift,
# serve smoke). The core replay tooling does not need it.
app = ["ai-app"]

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
ai-app = { path = "../../services/app", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmarks"]
