[project]
name = "ai-analytics-poc"
version = "0.0.0"
description = "Production-shaped AI analytics architecture POC"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["services", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
