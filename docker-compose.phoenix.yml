# Local Arize Phoenix trace UI (#190): the LiteLLM proxy exports OpenInference spans to it.
# Part of the default local path (`make local-aws-litellm-compose`); local only, never deployed.
# Full prompts, responses and tool-call arguments are stored in the `phoenix_data` volume:
# purge with `make phoenix-purge`. UI: http://127.0.0.1:${PHOENIX_PORT:-16006}
# The shared infra/litellm/config.yaml is untouched (it is also the deployed proxy's config):
# PHOENIX_COLLECTOR_HTTP_ENDPOINT makes LiteLLM attach its Phoenix logger next to the `otel` callback.
x-phoenix-tracing: &phoenix-tracing
  OTEL_TRACING_ENABLED: "true"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces

services:
  phoenix:
    image: arizephoenix/phoenix:version-20.26.1
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-16006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

  # App and MCP export their own spans straight to Phoenix so a trace shows the whole run (ai.run ->
  # LLM calls -> MCP tool); everything lands in Phoenix's `default` project.
  # LITELLM_OTEL=1 (docker-compose.observability.yml) later overrides the endpoint to the Collector/Jaeger.
  app:
    environment:
      <<: *phoenix-tracing
      # Bounded question/answer on the ai.run span so the Phoenix grid shows Input/Output
      # (off in the app by default; AI_TRACE_RUN_IO=0 turns it off here too).
      AI_TRACE_RUN_IO: "${AI_TRACE_RUN_IO:-1}"
    depends_on:
      phoenix:
        condition: service_started

  mcp:
    environment:
      <<: *phoenix-tracing
      # Opt-in: put a bounded copy of tool result rows on the duckdb.query span (data, not metadata).
      MCP_TRACE_RESULTS: "${MCP_TRACE_RESULTS:-0}"
      MCP_TRACE_RESULT_MAX_BYTES: "${MCP_TRACE_RESULT_MAX_BYTES:-4096}"

  litellm:
    environment:
      PHOENIX_COLLECTOR_HTTP_ENDPOINT: http://phoenix:6006/v1/traces
    depends_on:
      phoenix:
        condition: service_started

volumes:
  phoenix_data:
