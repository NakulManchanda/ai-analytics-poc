[project]
name = "analytics-mcp"
version = "0.1.0"
description = "Empty FastMCP service for the AI Analytics POC"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2,<3",
]

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
