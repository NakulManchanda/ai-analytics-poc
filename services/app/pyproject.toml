[project]
name = "ai-app"
version = "0.1.0"
description = "AI Analytics POC application service"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "black>=25.1,<26",
    "httpx2>=2,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
