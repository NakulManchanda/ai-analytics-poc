# LiteLLM Proxy config (issue #168). Agent policy selects aliases; the proxy owns the provider mapping.
# Bedrock only: the planner targets Nova Pro, answer/classifier Nova Micro; both are IAM-allowlisted
# (infra/terraform/variables.tf). No public-provider entries.
# Credentials come from the AWS SDK chain (mounted ~/.aws profile locally, task/instance role on AWS).
model_list:
  - model_name: taxi-classifier
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0
      aws_region_name: us-east-1
  - model_name: taxi-planner
    litellm_params:
      model: bedrock/amazon.nova-pro-v1:0
      aws_region_name: us-east-1
  - model_name: taxi-answer
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0
      aws_region_name: us-east-1

litellm_settings:
  drop_params: true      # e.g. vLLM-only knobs never reach Bedrock
  num_retries: 0         # the app owns retry/deadline semantics
  callbacks: ["otel"]    # trace context propagation; exporter via OTEL_* env

  # Spend guard layers (#170, docs/model-policy.md): the app's DynamoDB monthly guard is
  # authoritative. Proxy budgets are defense in depth only and need the proxy DB for
  # per-key/team budgets (not enabled in the stateless deployed proxy). To add a coarse
  # in-proxy ceiling, set `max_budget: <usd>` and `budget_duration: 30d` here; it is NOT
  # relied on and is unverified in this repo.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
