server:
  persistentVolume:
    enabled: false
  service:
    type: ClusterIP
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s

extraScrapeConfigs: |
  - job_name: inference-workers
    static_configs:
      - targets:
          - inference-worker-a.inference-lab.svc.cluster.local:8000
          - inference-worker-b.inference-lab.svc.cluster.local:8000
  - job_name: inference-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - inference-gateway.inference-lab.svc.cluster.local:8080
  - job_name: hami
    static_configs:
      - targets:
          - hami-device-plugin-monitor.kube-system.svc.cluster.local:31992
          - hami-scheduler.kube-system.svc.cluster.local:31993
  - job_name: dcgm
    static_configs:
      - targets:
          - dcgm-exporter.inference-lab.svc.cluster.local:9400

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
prometheus-pushgateway:
  enabled: false
