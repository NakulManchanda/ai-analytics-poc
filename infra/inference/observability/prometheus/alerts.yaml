# Prometheus alerting rules for the inference lab (#123 slice B).
# Loaded by deploy.sh, which nests this file under serverFiles.alerting_rules.yml in a values file; alertmanager stays
# disabled, so these are visible/firing in the Prometheus UI only. Rationale: README "Alerts".
groups:
  - name: inference-lab
    rules:
      - alert: InferenceKVPressureSustained
        expr: max by (instance) (vllm:kv_cache_usage_perc) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "KV cache above 85% on {{ $labels.instance }} for 5m"
          description: "Sustained KV pressure precedes queueing and preemptions."
      - alert: GatewayInteractiveTTFTSLOBreach
        expr: histogram_quantile(0.99, sum by (le) (rate(gateway_ttft_seconds_bucket{class="interactive"}[5m]))) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Gateway-observed interactive p99 streaming TTFT above 100ms for 5m"
          description: "Client-visible TTFT from the gateway (first streamed chunk with content), streaming interactive requests only; non-streaming requests are not measured. Includes gateway queue time."
      - alert: InferenceEngineTTFTHigh
        expr: histogram_quantile(0.95, sum by (le, instance) (rate(vllm:time_to_first_token_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Engine-side p95 TTFT above 100ms on {{ $labels.instance }} for 5m"
          description: "Supplemental: engine-side TTFT across all classes, excludes gateway queue time. The SLO alert is GatewayInteractiveTTFTSLOBreach."
      - alert: GatewayQueueShedSurge
        expr: (sum(rate(orch_shed_total[5m])) or vector(0)) + (sum(rate(queue_error_total{reason="timeout_queue"}[5m])) or vector(0)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway sheds plus queue timeouts above 0.5/s for 5m"
          description: "Load exceeds capacity or a queue is stuck; see the Gateway & Admission dashboard."
      - alert: InferenceWorkerIntegrity
        expr: >-
          (worker_health{state!="healthy"} == 1)
          or (worker_snapshot_age_seconds > 15)
          or (sum by (instance) (rate(vllm:num_preemptions_total[5m])) > 0.1)
          or (up{job=~"inference-gateway|inference-workers"} == 0)
          or absent(up{job="inference-gateway"})
          or ((count(up{job="inference-workers"} == 1) or vector(0)) < 2)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Worker, engine or scrape-target integrity problem"
          description: "Worker unhealthy/stale, snapshot older than 15s, preemptions above 0.1/s, a gateway/worker scrape target down or missing, or fewer than 2 workers up."
