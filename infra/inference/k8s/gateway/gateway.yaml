apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: inference-lab
  labels:
    app: inference-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: python:3.12.9-slim
          command:
            - sh
            - -c
            - "pip install --no-cache-dir fastapi uvicorn httpx prometheus-client && uvicorn main:app --host 0.0.0.0 --port 8080 --app-dir /app"
          workingDir: /app
          env:
            - name: DEFAULT_WORKER_URL
              value: "http://inference-worker-a.inference-lab.svc.cluster.local:8000"
            - name: WORKER_A_URL
              value: "http://inference-worker-a.inference-lab.svc.cluster.local:8000"
            - name: WORKER_B_URL
              value: "http://inference-worker-b.inference-lab.svc.cluster.local:8000"
            - name: PLACEMENT_POLICY
              value: "prefix_then_load"
            # Gateway limits tied to the engine flags in k8s/workers/*.yaml (a test enforces the match):
            # decode slots = --max-num-seqs; dispatch slots per worker = --max-num-seqs so excess work
            # waits in the gateway queue, not in vLLM's; prompt + completion must fit --max-model-len.
            - name: MAX_DECODE_SLOTS
              value: "8"
            - name: WORKER_MAX_INFLIGHT
              value: "8"
            - name: MAX_MODEL_LEN
              value: "8192"
            - name: MAX_PROMPT_TOKENS
              value: "8192"
            - name: KV_FREE_MIN
              value: "0.10"
            # Placeholders until the on-host calibration run (playbook): measured values replace these.
            - name: PREFILL_TOKENS_PER_S
              value: "4000"
            - name: QUEUE_WAIT_PER_WAITING_S
              value: "0.25"
            # Warm gate: a worker takes traffic only after N healthy scrapes and one probe request.
            - name: WARM_GATE
              value: "1"
            - name: WARM_MIN_SCRAPES
              value: "3"
            - name: WARM_PROBE_MODEL
              value: "Qwen/Qwen3-0.6B"
            # Test-only experiment headers (#123): keep "0" outside controlled E3/E4 runs.
            - name: ALLOW_EXPERIMENT_CONTROLS
              value: "0"
            # Overflow (#122 slice 4): off by default. To enable, set OVERFLOW_ENABLED "1" plus the
            # destination below; OVERFLOW_API_KEY must come from a Secret, never a literal here.
            - name: OVERFLOW_ENABLED
              value: "0"
            - name: OVERFLOW_PROVIDER
              value: ""
            - name: OVERFLOW_MODEL
              value: ""
            - name: OVERFLOW_URL
              value: ""  # OpenAI-compatible .../v1/chat/completions
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: gateway-code
              mountPath: /app
      volumes:
        - name: gateway-code
          configMap:
            name: inference-gateway-code

