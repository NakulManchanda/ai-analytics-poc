apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker-b
  namespace: inference-lab
  labels:
    app: inference-worker-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-worker-b
  template:
    metadata:
      labels:
        app: inference-worker-b
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      schedulerName: hami-scheduler
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --revision
            - c1899de289a04d12100db370d81485cdf75e47ca
            - --dtype
            - bfloat16
            - --kv-cache-dtype
            - auto
            - --max-model-len
            - "8192"
            - --max-num-seqs
            - "8"
            - --max-num-batched-tokens
            - "8192"
            - --block-size
            - "16"
            - --enable-prefix-caching
            - --gpu-memory-utilization
            - "0.45"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          envFrom:
            - configMapRef:
                name: inference-config
                optional: true
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          resources:
            limits:
              nvidia.com/gpu: 1
              nvidia.com/gpumem-percentage: "50"
              nvidia.com/gpucores: "50"
