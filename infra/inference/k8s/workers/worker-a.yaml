apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker-a
  namespace: inference-lab
  labels:
    app: inference-worker-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-worker-a
  template:
    metadata:
      labels:
        app: inference-worker-a
    spec:
      schedulerName: hami-scheduler
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --revision
            - c1899de289a04d12100db370d81485cdf75e47ca
            - --dtype
            - bfloat16
            - --kv-cache-dtype
            - auto
            - --max-model-len
            - "8192"
            - --max-num-seqs
            - "8"
            - --max-num-batched-tokens
            - "8192"
            - --block-size
            - "16"
            - --enable-prefix-caching
            - --gpu-memory-utilization
            - "0.45"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
              nvidia.com/gpumem: "50"
              nvidia.com/gpucores: "50"
